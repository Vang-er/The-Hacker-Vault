{% load static %}
<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="bg-gray-100 text-gray-900 min-h-screen">
    <nav
      class="w-full bg-white border-b border-gray-300 px-6 py-3 flex items-center justify-between sticky top-0 z-30"
    >
      <div class="flex items-center gap-4">
        <span class="text-sm font-bold tracking-tight text-gray-900">
          Hacker Warehouse
        </span>
        <a href="/inventory/" class="cursor-pointer text-sm font-bold px-3 py-1.5 rounded-lg bg-gray-200 transition">
         Inventory 
        </a>
        <a href="/history/" class="cursor-pointer text-sm font-bold px-3 py-1.5 rounded-lg hover:bg-gray-200 transition">
          History
        </a>
      </div>
      <div class="flex-1 flex justify-center px-6">
        <form id="searchform" class="w-full max-w-4xl" onsubmit="event.preventDefault();">
          <div class="relative flex items-center">
            <input
              id="searchfeald"
              type="search"
              name="q"
              placeholder="Search products, brands, SKUs..."
              class="w-full bg-gray-100 border rounded-lg px-4 py-2 text-sm outline-none"
            />
            <button
              type="submit"
              class="absolute right-3 cursor-pointer text-gray-500 hover:text-black"
            >
              <i data-lucide="search" class="h-4 w-4"></i>
            </button>
          </div>
        </form>
      </div>
      <div style="margin-left: auto;" class="flex items-center">
        <a
          href="/logout/"
          class="text-sm font-bold text-red-600 hover:underline px-3 py-1.5 cursor-pointer"
        >
          Log out
        </a>
      </div>
    </nav>
    <div class="" id="homepage">






      <div
        id="backdrop"
        onclick="hidewindow()"
        class="hidden fixed inset-0 bg-black/50 z-40 transition-opacity"      
      ></div>
      
      <div
        id="window"
        class="hidden fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-50 w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-gray-200 p-6 max-h-[90vh] overflow-y-auto"
      >
        <div class="flex items-center justify-between border-b pb-3 mb-4">
          <h2 class="text-lg font-bold text-gray-900">Add to Warehouse</h2>
          <button
            type="button"
            onclick="hidewindow()"
            class="cursor-pointer text-gray-400 hover:text-gray-700 font-bold text-lg p-1"
          >
            X
          </button>
        </div>

        <div class="flex rounded-lg bg-gray-100 p-1 mb-5">
          <button
            type="button"
            id="addcat"
            onclick="switchTap('cat')"
            class="flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-xs cursor-pointer transition"
          >
            Category
          </button>
          <button
            type="button"
            id="addpro"
            onclick="switchTap('pro')"
            class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 cursor-pointer transition"
          >
            Product
          </button>
          <button
            type="button"
            id="addstock"
            onclick="switchTap('stock')"
            class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 cursor-pointer transition"
          >
            Stock Intake
          </button>
        </div>

        <form id="cat" class="flex flex-col gap-3">
          {% csrf_token %}
          <div>
            <label for="catname" class="block text-xs font-bold text-gray-700 mb-1">Category Name*</label>
            <input
              id="catname"
              type="text"
              required
              placeholder="Tools, Sensors, Cables, etc."
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>
          <div>
            <label for="catdes" class="block text-xs font-bold text-gray-700 mb-1">Description</label>
            <input
              id="catdes"
              type="text"
              placeholder="Optional short description..."
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>
            <label></label>
            <select
              id="catsect"
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            >
              <option value="">No Parent</option>
            </select>
          <button
            type="submit"
            class="mt-2 w-full cursor-pointer bg-gray-900 hover:bg-black text-white font-bold py-2.5 rounded-lg text-sm transition active:scale-98"
          >
            Create Category
          </button>
        </form>

        <form id="pro" class="hidden flex-col gap-3">
          <div>
            <label for="proname" class="block text-xs font-bold text-gray-700 mb-1">Product Name*</label>
            <input
              id="proname"
              type="text"
              required
              placeholder="Soldering Iron, Arduino Uno, etc."
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>

          <div>
            <label for="procat" class="block text-xs font-bold text-gray-700 mb-1">Category*</label>
            <select 
              id="procat"
              required
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            >
              <option value="">Select a Category...</option>
            </select>
          </div>


          <div>
            <label for="probrand" class="block text-xs font-bold text-gray-700 mb-1">Brand</label>
            <input
              id="probrand"
              type="text"
              placeholder="Generic, Nivida, etc."
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>

          <div>
            <label for="prodes" class="block text-xs font-bold text-gray-700 mb-1">Description</label>
            <input
              id="prodes"
              type="text"
              placeholder="Optional notes.."
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>
          <button
            type="submit"
            class="mt-2 w-full cursor-pointer bg-gray-900 hover:bg-block text-white font-bold py-2.5 rounded-lg text-sm transition active:scale-98"
          >
            Create Product
        </button>
        </form>

        <form id="stock" class="hidden flex-col gap-3">
          <div>
            <label for="prostc" class="block text-xs font-bold text-gray-700 mb-1">Select Item Variant*</label>
            <select
              id="prostc"
              required
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            >
              <option value="">Select an Item..</option>
            </select>
          </div>

          <div>
            <label for="stockqty" class="block text-xs font-bold text-gray-700 mb-1">Quantity to Receive*</label>
            <input
              id="stockqty"
              type="number"
              min="1"
              value="1"
              required
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>

          <div>
            <label for="stocknote" class="block text-xs font-bold text-gray-700 mb-1">Intake Note</label>
            <input
              id="stocknote"
              type="text"
              placeholder="Restock, Supplier delivery, etc."
              class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:bg-white focus:border-gray-500"
            />
          </div>

          <button 
            type="submit"
            class="mt-2 w-full cursor-pointer bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-lg text-sm transition active:scale-98"
          >
            Receive Into Stock
          </button>
        </form>
      </div>

    

      <main class="max-w-6xl mx-auto px-6 py-6">
        <div id="inventory-browser" class="w-full">
          <div class="flex items-center justify-between border-b pb-4 mb-6">
            <div class="flex items-center gap-3">
              <button
                id="browser-back"
                onclick="showRootCategories()"
                class="hidden cursor-pointer rounded-lg bg-gray-800 hover:bg-black px-3 py-1.5 text-xs font-bold text-white transition active:scale-95"
              >
                <-Back
              </button>
              <h1 id="browser-title" class="text-2xl font-bold text-gray-900">Categories</h1>
            </div>

            <button
              type="button"
              onclick="showwindow()"
              class="cursor-pointer text-sm font-bold bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg transition active:scale-95 flex items-center gap-1.5"
            >
              <span>+</span> Add Items
            </button>
          </div>

          <div
            id="browser-grid"
            class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
          ></div>
        </div>
      </main>




    </div>
    <div id="withdraw-bar" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden bg-gray-800 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-6 border-2 border-green-400">
      <div>
        <span class="text-xs uppercase tracking-wide text-gray-400">Total:</span>
        <div id="withdraw-total-count" class="text-lg font-bold text-green-300">0</div>
      </div>
      <button id="withdraw-btn" onclick="executeBatchWithdraw()" class="bg-green-500 hover:bg-green-600 active:scale-95 text-black font-extrabold px-5 py-2.5 rounded-xl cursor-pointer transition-all shadow-md">
        Confirm Withdrawal
      </button>
      <button onclick="clearWithdrawCart()" class="text-xs text-red-400 hover:underline cursor-pointer">
        Clear
      </button>
    </div>
  </body>
  <script>
    const catslect = document.getElementById("catslect");
    const browserTitle = document.getElementById("browser-title");
    const browserGrid = document.getElementById("browser-grid");
    const browserBack = document.getElementById("browser-back");
    const variantform = document.getElementById("var");
    const productform = document.getElementById("pro");
    const numlogs = document.getElementById("numlogs");
    const homepage = document.getElementById("homepage");
    const swindow = document.getElementById("window");
    const backdrop = document.getElementById("backdrop");
    const addstock = document.getElementById("addstock");
    const searchtxt = document.getElementById("searchtxt");
    const addcat = document.getElementById("addcat");
    let stockpressed = false;
    let catpresser = false;
    const addvariants = document.getElementById("addvariants");
    const cat = document.getElementById("cat");
    const addpro = document.getElementById("addpro");
    const searchfeald = document.getElementById("searchfeald");
    const stock = document.getElementById("stock");

    const csrfToken = document.querySelector(
      "[name=csrfmiddlewaretoken]",
    ).value;
    function createCard(title, description) {
      const card = document.createElement("div");

      card.className =
        "cursor-pointer rounded-2xl bg-white p-5 shadow transition hover:scale-[1.02]";

      card.innerHTML = `
        <h2 class="text-xl font-bold">
            ${title}
        </h2>

        <p class="text-sm text-gray-500">
            ${description}
        </p>
    `;

      return card;
    }
    let varpressed = false;
    let propressed = false;
    let categories = [];
    let products = [];

    let stockMap = {};
    let withdrawCart = {};

    async function loadInventory() {
      const [categoriesResponse, productsResponse, stockResponse] = await Promise.all([
        fetch("/api/categories/"),
        fetch("/api/products/"),
        fetch("/api/stock/"),
      ]);

      const categoriesData = await categoriesResponse.json();
      const productsData = await productsResponse.json();
      const stockData = await stockResponse.json();

      categories = categoriesData.results;
      products = productsData.results;
      const stock = stockData.results || stockData;

      stockMap = {};
      stock.forEach((st) => {
        stockMap[st.variant] = st.id;
      });

      catslect.innerHTML = `
  <option value="">No parent</option>
`;

      categories.forEach((category) => {
        catslect.innerHTML += `
    <option value="${category.id}">
      ${category.name}
    </option>
  `;
      });

      showRootCategories();
    }
    function showRootCategories() {
      browserTitle.textContent = "Categories";
      browserBack.classList.add("hidden");

      browserGrid.innerHTML = "";

      const rootCategories = categories.filter(
        (category) => category.parent === null,
      );

      rootCategories.forEach((category) => {
        const card = createCard(
          category.name,
          category.description || "No description",
        );

        card.addEventListener("click", () => {
          openCategory(category.id);
        });

        browserGrid.appendChild(card);
      });
    }
    function openCategory(categoryId) {
      const category = categories.find(
        (category) => category.id === categoryId,
      );

      browserTitle.textContent = category.name;
      browserBack.classList.remove("hidden");

      browserGrid.innerHTML = "";

      const subcategories = categories.filter(
        (category) => category.parent === categoryId,
      );

      const categoryProducts = products.filter(
        (product) => product.category === categoryId,
      );

      subcategories.forEach((subcategory) => {
        const card = createCard(
          subcategory.name,
          subcategory.description || "Category",
        );

        card.addEventListener("click", () => {
          openCategory(subcategory.id);
        });

        browserGrid.appendChild(card);
      });

      categoryProducts.forEach((product) => {
        const card = createProductCard(product);

        browserGrid.appendChild(card);
      });
    }
    function createProductCard(product) {
      const card = document.createElement("div");

      card.className = "cursor-pointer rounded-xl bg-white border border-gray-200 p-5 shadow-xs transition hover:border-gray-400 hover:shadow-sm";

      card.innerHTML = `
        <h2 class="text-xl font-bold">
            ${product.name}
        </h2>

        <p class="text-sm text-gray-500">
            ${product.brand || "No brand"}
        </p>

        <p class="mt-2 text-sm">
            ${product.variants.length} variants
        </p>
    `;

      card.addEventListener("click", () => {
        openProduct(product.id);
      });

      return card;
    }
    function openProduct(productId) {
      const product = products.find((product) => product.id === productId);

      browserTitle.textContent = product.name;
      browserGrid.innerHTML = "";

      product.variants.forEach((variant) => {
        const card = document.createElement("div");

        card.className = "rounded-xl bg-white border border-gray-200 p-5 shadow-xs transition hover:shadow-md";

        const stockId = stockMap[variant.id] || variant.id;
        const currentSelectedQty = withdrawCart[variant.id]?.quantity || 0;
        const isOutOfStock = variant.quantity <= 0;

        card.innerHTML = `
            <div>
              <h2 class="text-lg font-bold">${variant.name || product.name}</h2>
              <p
              onclick="copySku('${variant.sku}', this)"
              class="text-xs font-mono bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 px-2.5 py-1 rounded-md cursor-pointer w-fit inline-flex items-center gap-1 transition-all select-none border border-gray-200 mt-1" title="Click to copy SKU"
              >
                <span>${variant.sku}</span>
              </p>

              <div class="mt-3 flex justify-between text-sm">
                  <span>Price</span>
                  <span class="font-bold">$${variant.price}</span>
              </div>

              <div class="flex justify-between text-sm mt-1">
                  <span>Stock</span>
                  <span class="font-bold ${isOutOfStock ? 'text-red-500' : 'text-green-700'}">
                    ${variant.quantity} units
                  </span>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t flex items-center justify-between">
              <span class="text-xs font-bold uppercase text-gray-600">Withdraw:</span>

              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="updateWithdrawQty(${variant.id}, ${stockId}, -1, ${variant.quantity}, '${variant.name || product.name}')"
                  class="w-8 h-8 rounded-lg bg-gray-200 hover:bg-gray-300 font-black cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                  ${currentSelectedQty === 0 ? "disabled" : ""}
                  id="minus-btn-${variant.id}"
                >
                  -
                </button>

                <span id="counter-${variant.id}" class="w-8 text-center font-bold">
                  ${currentSelectedQty}
                </span>

                <button
                  type="button"
                  onclick="updateWithdrawQty(${variant.id}, ${stockId}, 1, ${variant.quantity}, '${variant.name || product.name}')"
                  class="w-8 h-8 rounded-lg bg-gray-200 hover:bg-gray-300 font-black cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed"
                  ${isOutOfStock || currentSelectedQty >= variant.quantity ? "disabled" : ""}
                  id="plus-btn-${variant.id}"
                >
                  +
                </button>
              </div>
            </div>

                    
        <div class="mt-3">
          <input 
            type="text"
            id="reason-${variant.id}"
            oninput="updateWithdrawReason(${variant.id}, this.value)"
            value="${withdrawCart[variant.id]?.reason || ''}"
            placeholder="Reason (Sale, Damaged, Demo...)"
            class="w-full text-xs px-3 py-1.5 border border-gray-300 rounded-lg outline-none bg-gray-50 focus:bg-white focus:border-black transition-colors"
          />
        </div>
        `;

        browserGrid.appendChild(card);
      });
    }

    function copySku(sku, element) {
      navigator.clipboard.writeText(sku).then(() => {
        const originalContent = element.innerHTML;
        element.innerHTML = `<span class="text-green-700 font-bold">Copied!</span>`;
        setTimeout(() => {
          element.innerHTML= originalContent;
        }, 1200);
      });
    }

    const searchform = document.getElementById("searchform");

    searchfeald.addEventListener("input", (e) => {
      const query = e.target.value.trim().toLowerCase();

      if (!query) {
        showRootCategories();
        return;
      }

      const matches = products.filter((p) => {
        const matchName = p.name.toLowerCase().includes(query);
        const matchBrand = (p.name || "").toLowerCase().includes(query);
        const matchSku = p.variants?.some((v) =>
          v.sku.toLowerCase().includes(query)
      );
      return matchName || matchBrand || matchSku;
      });

      browserTitle.textContent = `Search results for "${query}" (${matches.length})`;
      browserBack.classList.remove("hidden");
      browserBack.onclick= () => {
        searchfeald.value ="";
        showRootCategories();
      };

      browserGrid.innerHTML = "";
      if (matches.length ===0 ) {
        browserGrid.innerHTML = `<p class="p-5 text-gray-700 italic">No Products Found. </p>`;
        return;
    }

    matches.forEach((p)=> {
      browserGrid.appendChild(createProductCard(p));
    });
  });

  searchform.addEventListener("submit", (e)=>e.preventDefault());

    function updateWithdrawQty(variantId, stockId, delta, maxStock, variantName) {
      if (!withdrawCart[variantId]) {
        const reasonInput = document.getElementById(`reason-${variantId}`);

        withdrawCart[variantId] = {
          variantId: variantId,
          stockId: stockId,
          quantity:0,
          variantName: variantName,
          reason: reasonInput ? reasonInput.value.trim(): "",
        };
      }
      let newQty = withdrawCart[variantId].quantity + delta;

      if (newQty < 0) newQty = 0;
      if (newQty > maxStock) newQty = maxStock;

      withdrawCart[variantId].quantity = newQty;
      if (newQty ===0) {
        delete withdrawCart[variantId];
      }

      const counterE1 = document.getElementById(`counter-${variantId}`);
      const minusBtn = document.getElementById(`minus-btn-${variantId}`);
      const plusBtn = document.getElementById(`plus-btn-${variantId}`);

      if (counterE1) counterE1.textContent = newQty;
      if (minusBtn) minusBtn.disabled = newQty <= 0;
      if (plusBtn) plusBtn.disabled = newQty >= maxStock;
      updateBottomBar();
    }

    function updateWithdrawReason(variantId, reasonValue) {
      if (!withdrawCart[variantId]) {
        withdrawCart[variantId] = {
          variantId: variantId,
          stockId: stockMap[variantId] || variantId,
          quantity: 0,
          variantName: "",
          reason: reasonValue.trim(),
        };
      } else {
        withdrawCart[variantId].reason = reasonValue.trim();
      }
    }

    function updateBottomBar() {
      const bar = document.getElementById("withdraw-bar");
      const totalCountE1 = document.getElementById("withdraw-total-count");

      const totalItems = Object.values(withdrawCart).reduce(
        (sum, item) => sum + item.quantity,
        0
      );
      if (totalItems > 0) {
        bar.classList.remove("hidden");
        totalCountE1.textContent = `${totalItems} unit${totalItems > 1 ? "s" : ""}`;
      } else {
        bar.classList.add("hidden");
      }
    }

    function clearWithdrawCart() {
      withdrawCart = {};
      updateBottomBar();
      const productTitle = browserTitle.textContent;
      const currentProduct = products.find(p => p.name === productTitle);
      if (currentProduct) openProduct(currentProduct.id);
    }

    async function executeBatchWithdraw() {
      const itemsToWithdraw = Object.values(withdrawCart);
      if (itemsToWithdraw.length === 0) return;

      const btn = document.getElementById("withdraw-btn");
      btn.disabled = true;
      btn.textContent = "Processing...";

      try {
        const requests = itemsToWithdraw.map((item) =>
        fetch(`/api/stock/${item.stockId}/issue/`, {
          method: "POST",
          headers: {
            "Content-type": "application/json",
            "X-CSRFToken": csrfToken,
          },
          body: JSON.stringify({
            quantity: item.quantity,
            note: item.reason || `Withdrawn via warehouse dashboard (${item.variantName})`,
          }),
        }).then(async (res) => {
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || `Faild to withdarw ${item.variantName}`);
          }
          return data;
      })
    );

    await Promise.all(requests);
    alert(`Successfully withdrawn ${itemsToWithdraw.length} Variant!`);
    withdrawCart = {};
    updateBottomBar();
    await loadInventory();
  } catch (err) {
    alert("Withdrawal Error: "+ err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirm Withdrawal";
  }
}

    function checkSearch() {
      if (searchtxt) {
        searchtxt.style.display = searchform.offsetWidth <= 250 ? "none" : "block";
      }
    }

    checkSearch();

    window.addEventListener("resize", checkSearch);
    addcat.addEventListener("click", () => {
      catpresser = true;
      stockpressed = false;

      addcat.style.backgroundColor = "#4B5563";
      addstock.style.backgroundColor = "#6B7280";
    });

    addstock.addEventListener("click", () => {
      stockpressed = true;
      catpresser = false;

      addstock.style.backgroundColor = "#4B5563";
      addcat.style.backgroundColor = "#6B7280";
    });

    function showwindow() {
      swindow.classList.remove("hidden");
      backdrop.classList.remove("hidden");
    }
    function hidewindow() {
      swindow.classList.add("hidden");
      backdrop.classList.add("hidden");
    }

    addvariants.addEventListener("click", () => {
      catpresser = false;
      stockpressed = false;
      varpressed = true;
      propressed = false;
      addvariants.style.backgroundColor = "#4B5563";
      addstock.style.backgroundColor = "#6B7280";
      addcat.style.backgroundColor = "#6B7280";
      addpro.style.backgroundColor = "#6B7280";
      cat.style.display = "none";
      stock.style.display = "none";
      productform.style.display = "none";
      variantform.style.display = "flex";
    });
    addpro.addEventListener("click", () => {
      stockpressed = false;
      catpresser = false;
      varpressed = false;
      propressed = true;
      addpro.style.backgroundColor = "#4B5563";
      addcat.style.backgroundColor = "#6B7280";
      addstock.style.backgroundColor = "#6B7280";
      addvariants.style.backgroundColor = "#6B7280";
      cat.style.display = "none";
      stock.style.display = "none";
      productform.style.display = "flex";
      variantform.style.display = "none";
    });
    addcat.addEventListener("click", () => {
      catpresser = true;
      stockpressed = false;
      varpressed = false;
      propressed = false;
      addcat.style.backgroundColor = "#4B5563";
      addstock.style.backgroundColor = "#6B7280";
