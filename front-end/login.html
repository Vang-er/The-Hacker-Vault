{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <style>
      .toast {
        transform: translateX(120%);
        transition: transform 0.3s ease, opacity 0.3s ease;
        opacity: 0;
      }
      .toast.toast-show {
        transform: translateX(0);
        opacity: 1;
      }
    </style>
  </head>

  <body style="min-height: 100vh;" class="bg-gray-100 text-gray-900 flex flex-col justify-center items-center p-4">
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>
    {% csrf_token %}
    <div style="max-width: 420px; width: 100%; padding: 36px 40px;" class="bg-white border border-gray-200 shadow-xl rounded-2xl">
      
      <div class="text-center mb-6">
        <span class="text-3xl"></span>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900 mt-2">Hacker Warehouse</h1>
        <p id="auth-subtitle" class="text-xs text-gray-500 mt-1">Sign in to manage warehouse inventory</p>
      </div>

      <div class="flex rounded-lg bg-gray-100 p-1 mb-6">
        <button
          type="button"
          id="tab-login"
          onclick="setMode('login')"
          class="flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-xs cursor-pointer transition"
        >
          Log In
        </button>
        <button
          type="button"
          id="tab-register"
          onclick="setMode('register')"
          class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 cursor-pointer transition"
        >
          Register
        </button>
      </div>

      <form id="auth-form" class="flex flex-col gap-4">
        <div>
          <label for="username" class="block text-xs font-bold text-gray-700 mb-1">Username</label>
          <input
            id="username"
            type="text"
            required
            autocomplete="username"
            placeholder="Enter your username"
            style="padding: 10px 16px;"
            class="w-full bg-gray-50 border border-gray-300 rounded-lg text-sm outline-none focus:bg-white focus:border-gray-500 transition"
          />
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-gray-700 mb-1">Password</label>
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
            style="padding: 10px 16px;"
            class="w-full bg-gray-50 border border-gray-300 rounded-lg text-sm outline-none focus:bg-white focus:border-gray-500 transition"
          />
        </div>

        <div id="confirm-password-container" class="hidden">
          <label for="confirm-password" class="block text-xs font-bold text-gray-700 mb-1">Confirm Password</label>
          <input
            id="confirm-password"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat your password"
            style="padding: 10px 16px;"
            class="w-full bg-gray-50 border border-gray-300 rounded-lg text-sm outline-none focus:bg-white focus:border-gray-500 transition"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="mt-2 w-full cursor-pointer bg-gray-900 hover:bg-black text-white font-bold py-2.5 rounded-lg text-sm transition active:scale-98 shadow-sm"
        >
          Log In
        </button>
      </form>

      <p id="toggle-helper" class="text-xs text-center text-gray-500 mt-6">
        Don't have an account?
        <button type="button" onclick="setMode('register')" class="text-gray-900 font-bold hover:underline cursor-pointer">
          Register now
        </button>
      </p>
    </div>

    <script>
      const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
      const authForm = document.getElementById("auth-form");
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const confirmContainer = document.getElementById("confirm-password-container");
      const confirmInput = document.getElementById("confirm-password");
      const submitBtn = document.getElementById("submit-btn");
      const subtitle = document.getElementById("auth-subtitle");
      const toggleHelper = document.getElementById("toggle-helper");

      let mode = "login";

      function setMode(newMode) {
        mode = newMode;
        const isRegister = mode === "register";

        confirmContainer.classList.toggle("hidden", !isRegister);
        confirmInput.required = isRegister;

        submitBtn.textContent = isRegister ? "Create Account" : "Log In";
        subtitle.textContent = isRegister
          ? "Create a new warehouse staff account"
          : "Sign in to manage warehouse inventory";

        tabLogin.className = !isRegister
          ? "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-xs cursor-pointer transition"
          : "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 cursor-pointer transition";

        tabRegister.className = isRegister
          ? "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-xs cursor-pointer transition"
          : "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900 cursor-pointer transition";

        toggleHelper.innerHTML = isRegister
          ? `Already have an account? <button type="button" onclick="setMode('login')" class="text-gray-900 font-bold hover:underline cursor-pointer">Log in</button>`
          : `Don't have an account? <button type="button" onclick="setMode('register')" class="text-gray-900 font-bold hover:underline cursor-pointer">Register now</button>`;
      }

      function showToast(message, type = "error") {
        const container = document.getElementById("toast-container");
        if (!container) return;
        const toast = document.createElement("div");
        const isError = type === "error";
        const borderColor = isError ? "border-l-red-500" : "border-l-green-600";
        const icon = isError ? '<span class="text-red-500 font-black text-sm">&#10005;</span>' : '<span class="text-green-600 font-black text-sm">&#10003;</span>';

        toast.className = `toast flex items-center gap-3 bg-white border border-gray-200 border-l-4 ${borderColor} rounded-xl px-4 py-3 shadow-lg text-sm text-gray-800 pointer-events-auto max-w-sm`;
        toast.innerHTML = `
          ${icon}
          <span class="flex-1 font-medium">${message}</span>
          <button type="button" class="text-gray-400 hover:text-gray-700 text-xs font-bold ml-2 cursor-pointer">✕</button>
        `;

        toast.querySelector("button").onclick = () => dismissToast(toast);
        container.appendChild(toast);

        requestAnimationFrame(() => toast.classList.add("toast-show"));
        setTimeout(() => dismissToast(toast), 3500);
      }

      function dismissToast(toast) {
        toast.classList.remove("toast-show");
        setTimeout(() => toast.remove(), 300);
      }

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const confirm_password = confirmInput.value;

        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = "Processing...";

        try {
          const endpoint = mode === "register" ? "/api/auth/register-api/" : "/api/auth/login-api/";
          const payload = mode === "register"
            ? { username, password, confirm_password }
            : { username, password };

          const res = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrf,
            },
            body: JSON.stringify(payload),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.detail || "Authentication failed.");
          }

          localStorage.setItem("access_token", data.access);
          localStorage.setItem("refresh_token", data.refresh);

          showToast(mode === "register" ? "Account created! Redirecting..." : "Logged in successfully!", "success");

          setTimeout(() => {
            window.location.href = "/inventory/";
          }, 800);

        } catch (err) {
          showToast(err.message, "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });
    </script>
  </body>
</html>
